<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SlotBook — Campus Resource Booking System. Browse and book seminar halls, labs, sports courts, and equipment.">
    <title>SlotBook — Campus Resources</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="main-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="logo-icon">📅</span>
                <span class="logo-text">Slot<span class="logo-accent">Book</span></span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link active" id="nav-home">Resources</a>
                <a href="my-bookings.html" class="nav-link" id="nav-bookings">My Bookings</a>
                <a href="admin.html" class="nav-link" id="nav-admin">Admin</a>
            </div>
            <div class="nav-user" id="nav-user">
                <a href="login.html" class="btn btn-outline btn-sm" id="nav-login-btn">Login</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero" id="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">Book Campus Resources</h1>
            <p class="hero-subtitle">Reserve seminar halls, labs, sports courts & equipment — conflict-free.</p>
        </div>
        <div class="hero-glow"></div>
    </section>

    <!-- Filter Bar -->
    <section class="filter-section" id="filter-section">
        <div class="container">
            <div class="filter-bar">
                <button class="filter-btn active" data-category="" id="filter-all">All</button>
                <button class="filter-btn" data-category="HALL" id="filter-hall">
                    <span class="filter-icon">🏛️</span> Halls
                </button>
                <button class="filter-btn" data-category="SPORTS" id="filter-sports">
                    <span class="filter-icon">🏸</span> Sports
                </button>
                <button class="filter-btn" data-category="LAB" id="filter-lab">
                    <span class="filter-icon">🔬</span> Labs
                </button>
                <button class="filter-btn" data-category="EQUIPMENT" id="filter-equipment">
                    <span class="filter-icon">🎛️</span> Equipment
                </button>
            </div>
        </div>
    </section>

    <!-- Resource Grid -->
    <section class="resources-section" id="resources-section">
        <div class="container">
            <div class="resource-grid" id="resource-grid">
                <!-- Cards populated by resources.js -->
            </div>
            <div class="empty-state hidden" id="empty-state">
                <div class="empty-icon">📭</div>
                <h3>No resources found</h3>
                <p>Try a different category filter.</p>
            </div>
            <div class="loading-spinner" id="loading-spinner">
                <div class="spinner"></div>
                <p>Loading resources...</p>
            </div>
        </div>
    </section>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="js/api.js"></script>
    <script src="js/resources.js"></script>
</body>
</html>
